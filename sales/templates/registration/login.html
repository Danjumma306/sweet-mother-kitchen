{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - {{ brand_name }}</title>
    <link rel="stylesheet" href="{% static 'sales/css/app.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--color-surface);
            border: 1px solid var(--color-line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 32px 28px;
            animation: rise 0.45s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .login-brand-logo {
            width: min(220px, 70vw);
            height: auto;
            display: block;
        }
        .login-brand p {
            margin: 0;
            color: var(--color-muted);
            font-size: 0.85rem;
        }
        .login-card label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--color-muted);
        }
        .login-card .btn-primary {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-brand">
        <img
            class="login-brand-logo"
            src="{% static 'sales/img/brand_logo.jpg' %}"
            alt="{{ brand_name }}"
            width="220"
            height="220"
        >
        <p>{{ brand_location }} · Staff login</p>
    </div>

    {% if form.errors %}
        <div class="msg error">Wrong username or password. Please try again.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Username</label>
        <input class="field-input" type="text" name="username" id="id_username" autofocus required>

        <label for="id_password">Password</label>
        <input class="field-input" type="password" name="password" id="id_password" required>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary">Log in</button>
    </form>
</div>
</body>
</html>
