{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - {{ brand_name }}</title>
    <link rel="stylesheet" href="{% static 'sales/css/app.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--color-surface);
            border: 1px solid var(--color-line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 32px 28px;
            animation: rise 0.45s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .login-brand h1 {
            margin: 0;
            font-family: var(--font-brand);
            font-size: 1.25rem;
            color: var(--color-forest);
            line-height: 1.25;
        }
        .login-brand p {
            margin: 2px 0 0;
            color: var(--color-muted);
            font-size: 0.85rem;
        }
        .login-card label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--color-muted);
        }
        .login-card .btn-primary {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
{% include "sales/partials/icons.html" %}
<div class="login-card">
    <div class="login-brand">
        <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><use href="#icon-cloche"/></svg>
        </div>
        <div>
            <h1>{{ brand_name }}</h1>
            <p>{{ brand_location }} · Staff login</p>
        </div>
    </div>

    {% if form.errors %}
        <div class="msg error">Wrong username or password. Please try again.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Username</label>
        <input class="field-input" type="text" name="username" id="id_username" autofocus required>

        <label for="id_password">Password</label>
        <input class="field-input" type="password" name="password" id="id_password" required>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary">Log in</button>
    </form>
</div>
</body>
</html>
