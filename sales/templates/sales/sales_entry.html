<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Sale - Sweet Mother Kitchen</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .card { max-width: 760px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
        h1 { margin-top: 0; font-size: 22px; }
        .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
        .msg.success { background: #d4edda; color: #155724; }
        .msg.error { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
        th { font-size: 13px; color: #555; }
        select, input[type=number] { width: 100%; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
        .num { text-align: right; white-space: nowrap; }
        button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 4px; cursor: pointer; }
        .add { background: #e7e7e7; }
        .remove { background: #f8d7da; color: #721c24; padding: 6px 10px; }
        .save { background: #2e7d32; color: #fff; width: 100%; margin-top: 14px; font-size: 17px; }
        .pay { margin: 16px 0 8px; }
        .pay label { margin-right: 16px; font-size: 15px; }
        .grand { text-align: right; font-size: 20px; font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h1>New Sale</h1>

    {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="post" id="sale-form">
        {% csrf_token %}

        <table>
            <thead>
                <tr>
                    <th style="width:42%">Item</th>
                    <th style="width:16%">Qty</th>
                    <th class="num">Unit price</th>
                    <th class="num">Line total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lines"></tbody>
        </table>

        <button type="button" class="add" id="add-line">+ Add item</button>

        <div class="pay">
            <strong>Payment method:</strong><br>
            {% for value, label in payment_methods %}
                <label>
                    <input type="radio" name="payment_method" value="{{ value }}"
                           {% if forloop.first %}checked{% endif %}> {{ label }}
                </label>
            {% endfor %}
        </div>

        <div class="grand">Total: GH₵ <span id="grand-total">0.00</span></div>

        <button type="submit" class="save">Save sale</button>
    </form>
</div>

<!-- One blank row. JavaScript copies this each time you click "Add item". -->
<template id="line-template">
    <tr class="line">
        <td>
            <select name="item" class="item-select">
                <option value="">Select an item...</option>
                {% for category in categories %}
                    {% if category.active_items %}
                        <optgroup label="{{ category.name }}">
                            {% for item in category.active_items %}
                                <option value="{{ item.id }}" data-price="{{ item.price|stringformat:'f' }}">
                                    {{ item.name }} ({{ item.unit }})
                                </option>
                            {% endfor %}
                        </optgroup>
                    {% endif %}
                {% endfor %}
            </select>
        </td>
        <td><input type="number" name="quantity" class="qty" min="1" value="1"></td>
        <td class="num">GH₵ <span class="unit-price">0.00</span></td>
        <td class="num">GH₵ <span class="line-total">0.00</span></td>
        <td><button type="button" class="remove">X</button></td>
    </tr>
</template>

<script>
    const lines = document.getElementById("lines");
    const template = document.getElementById("line-template");
    const grandTotal = document.getElementById("grand-total");

    function recalculate() {
        let total = 0;
        lines.querySelectorAll(".line").forEach(row => {
            const select = row.querySelector(".item-select");
            const option = select.options[select.selectedIndex];
            const price = parseFloat(option.dataset.price || "0");
            const qty = parseInt(row.querySelector(".qty").value, 10) || 0;
            const lineTotal = price * qty;

            row.querySelector(".unit-price").textContent = price.toFixed(2);
            row.querySelector(".line-total").textContent = lineTotal.toFixed(2);
            total += lineTotal;
        });
        grandTotal.textContent = total.toFixed(2);
    }

    function addLine() {
        lines.appendChild(template.content.cloneNode(true));
        recalculate();
    }

    document.getElementById("add-line").addEventListener("click", addLine);

    lines.addEventListener("input", recalculate);
    lines.addEventListener("change", recalculate);
    lines.addEventListener("click", event => {
        if (event.target.classList.contains("remove")) {
            event.target.closest(".line").remove();
            recalculate();
        }
    });

    addLine(); // start with one empty row
</script>
</body>
</html>
